<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EScanBai QR ID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mobile-frame">
    <div class="card" style="margin-top: 20%; text-align: center;">
        
        <div class="card-header">
            <h2>QR ID</h2>
        </div>
        <div id="qr-container" style="background-color: #ffffff; padding: 20px; border-radius: 12px; margin: 15px auto; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <img id="live-qr" src="" alt="Loading QR..." style="width: 200px; height: 200px; display: block;">
        </div>

        <h3 id="student-name-display" style="font-size: 18px; margin-top: 10px; margin-bottom: 4px; color: var(--text-main);">Loading...</h3>
        <p id="student-course-display" style="font-size: 13px; color: var(--text-muted); margin-bottom: 25px;">Loading...</p>

        <div class="form-row">
            <a href="dashboard.html" class="btn btn-outline">Edit Profile</a>
        </div>

    </div>
</div>

<script src="app.js"></script>
</body>
</html>
