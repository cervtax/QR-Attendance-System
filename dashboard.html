<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EScanBai Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
<div class="mobile-frame">
    <nav class="app-nav" aria-label="Main">
        <a href="dashboard.html" data-nav="profile">Profile</a>
        <a href="dashboard.html#attendance-card" data-nav="attendance">Attendance</a>
        <a href="qr-id.html" data-nav="qr">QR ID</a>
        <a href="login.html" id="logout-link">Log Out</a>
    </nav>

    <header class="greeting">
        <h1 id="greeting-title">EScanBai <span id="greeting-name"></span></h1>
        <p>Welcome back! Manage your QR ID and check-ins here.</p>
    </header>

    <div class="card">
        <div class="card-header">
            <h2>Student</h2>
            <p>Fill out your current credentials to have your QR ID.</p>
        </div>
        <form id="profile-form" autocomplete="off">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" value="" autocomplete="off" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="studentNo">Student Number</label>
                    <input type="text" id="studentNo" class="form-control" value="" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="course">Course Program</label>
                    <input type="text" id="course" class="form-control" value="" autocomplete="off" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="yearLevel">Year Level</label>
                    <select id="yearLevel" class="form-control" required>
                        <option value="" selected disabled>Select year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="section">Section</label>
                    <input type="text" id="section" class="form-control" value="" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="events">Events</label>
                    <input type="text" id="events" class="form-control" value="" autocomplete="off" required>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button type="submit" id="profile-submit" class="btn btn-primary">Save &amp; Generate QR Code</button>
            </div>
        </form>
    </div>

    <div class="card" id="attendance-card">
        <div class="card-header">
            <h2>Attendance History</h2>
            <p>QR check-ins</p>
        </div>
        <div class="table-container">
            <table class="audit-table">
                <thead><tr><th>Date</th><th>Time</th><th>Event</th><th>Status</th></tr></thead>
                <tbody id="attendance-log"></tbody>
            </table>
        </div>
        <div class="history-actions">
            <span id="history-count" class="history-count"></span>
            <button type="button" id="clear-history-btn" class="btn btn-danger-outline">Clear History</button>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
