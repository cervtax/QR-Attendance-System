<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EScanBai Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="mobile-frame">
    <div class="card">
        <div class="card-header">
            <h2></span> Student</h2>
            <p>Fill out your current credentials to have your QR ID.</p>
        </div>
        <form onsubmit="saveProfile(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" class="form-control" value="" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Student Number</label>
                    <input type="text" id="studentNo" class="form-control" value="" required>
                </div>
                <div class="form-group">
                    <label>Course Program</label>
                    <input type="text" id="course" class="form-control" value="" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Year Level</label>
                    <select class="form-control">
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option selected>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <input type="text" id="section" class="form-control" value="" required>
                </div>
                <div class="form-group">
                    <label>Event</label>
                    <input type="text" id="section" class="form-control" value="" required>
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button type="submit" class="btn btn-primary">Save & Generate QR Code</button>
            </div>
        </form>
    </div>
    <div class="card">
        <div class="card-header">
            <h2>Attendance History</h2>
            <p>QR check-ins</p>
        </div>
        <div class="table-container">
            <table class="audit-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attendance-log">
                    <tr></tr>
                    <tr></tr>
                    <tr></tr>
                </tbody>
            </table>
        </div>
    </div>
        <div style="text-align: center; margin-top: 10px;">
        <a href="login.html" style="color: var(--text-muted); font-size: 12px; text-decoration: none;">← Log Out</a>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
